name: SKT HA-BB option paper

on:
  schedule:
    # GitHub's scheduler is best-effort and has skipped these slots entirely,
    # so fire several attempts well before the 09:07 pre-open spot capture.
    # The concurrency group keeps at most one extra run queued, and that one
    # exits on the "started too late" guard below, so duplicates cost nothing.
    - cron: '10 3 * * 1-5'   # 08:40 IST
    - cron: '17 3 * * 1-5'   # 08:47 IST
    - cron: '24 3 * * 1-5'   # 08:54 IST
    - cron: '30 3 * * 1-5'   # 09:00 IST
    - cron: '40 3 * * 1-5'   # 09:10 IST (late, but still a trading session)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ha-bb-option-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Skip if started too late
        id: window
        run: |
          H=$(TZ=Asia/Kolkata date +%H%M)
          if [ "$H" -gt "1400" ]; then
            echo "Started at $H IST - too late, skipping (clean exit)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run HA-BB paper engine
        if: steps.window.outputs.skip != 'true'
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/ha_bb_option_paper.py

      - name: Save paper log
        if: always() && steps.window.outputs.skip != 'true'
        run: |
          git config user.name "nse-bot"
          git config user.email "nse-bot@users.noreply.github.com"
          git add data || true
          git commit -m "HA-BB paper trades $(TZ=Asia/Kolkata date +%F)" || echo "nothing to commit"
          git pull --rebase -X theirs || true
          git push || true
