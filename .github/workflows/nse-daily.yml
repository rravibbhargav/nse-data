name: NSE daily data
on:
  schedule:
    - cron: '45 12 * * 1-5'   # 18:15 IST, Monday to Friday
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/nse-daily.yml'

permissions:
  contents: write

concurrency:
  group: nse-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Fetch NSE data and compute
        env:
          MODE: ${{ github.event_name }}
        run: python3 scripts/nse_daily.py
      - name: Save results
        run: |
          git config user.name "nse-bot"
          git config user.email "nse-bot@users.noreply.github.com"
          git add data
          git commit -m "NSE data $(TZ=Asia/Kolkata date +%F)" || echo "nothing to commit"
          git pull --rebase
          git push
