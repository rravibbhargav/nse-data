name: SKT swing scanner
on:
  schedule:
    - cron: '20 13 * * 1-5'   # 18:50 IST, Monday to Friday (after EOD data settles)
  workflow_dispatch:
  push:
    paths:
      - 'scripts/swing_scanner.py'
      - '.github/workflows/swing-scan.yml'

permissions:
  contents: write

concurrency:
  group: swing-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install libraries
        run: pip install --quiet yfinance pandas numpy
      - name: Run swing scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/swing_scanner.py
      - name: Save results
        run: |
          git config user.name "nse-bot"
          git config user.email "nse-bot@users.noreply.github.com"
          git add data
          git commit -m "Swing scan $(TZ=Asia/Kolkata date +%F)" || echo "nothing to commit"
          git pull --rebase
          git push
