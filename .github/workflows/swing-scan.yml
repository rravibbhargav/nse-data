name: SKT swing scanner
on:
  schedule:
    - cron: '20 13 * * 1-5'   # 18:50 IST, Monday to Friday (after EOD data settles)
    - cron: '30 15 * * 1-5'   # 21:00 IST backup (GitHub often delays schedules)
    - cron: '0 18 * * 1-5'    # 23:30 IST backup; backups skip if the day is already sent
  workflow_dispatch:
    inputs:
      force:
        description: 'Resend even if today was already sent'
        type: boolean
        default: false
  push:
    paths:
      - 'scripts/swing_scanner.py'
      - 'scripts/reversal_scanner.py'
      - '.github/workflows/swing-scan.yml'

permissions:
  contents: write

concurrency:
  group: swing-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always latest data, so the "already sent" check sees earlier runs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install libraries
        run: pip install --quiet yfinance pandas numpy
      - name: Run swing scanner
        env:
          MODE: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/swing_scanner.py
      - name: Run 52W-low reversal scanner
        continue-on-error: true
        env:
          MODE: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: python3 scripts/reversal_scanner.py
      - name: Save results
        run: |
          git config user.name "nse-bot"
          git config user.email "nse-bot@users.noreply.github.com"
          git add data
          git commit -m "Swing + reversal scan $(TZ=Asia/Kolkata date +%F)" || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && echo "pushed on attempt $i" && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "::warning::Could not push scan results after 3 attempts; alert was already sent."
