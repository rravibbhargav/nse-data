name: SKT intraday breadth paper
on:
  schedule:
    - cron: '25 3 * * 1-5'   # 08:55 IST
    - cron: '35 3 * * 1-5'   # 09:05 IST (backup if the first run is delayed)
  push:
    paths:
      - '.github/kick-intraday'      # Claude ka daily kick: cron late ho to bhi turant chale
  workflow_dispatch:
    inputs:
      replay_date:
        description: 'Replay a past day (YYYY-MM-DD), blank = live paper'
        default: ''
      replay_symbols:
        description: 'Replay symbols, comma separated'
        default: ''
      replay_side:
        description: 'LONG or SHORT (replay only)'
        default: 'SHORT'
      force:
        description: 'true = 09:40 window guard bypass karo (same-day test)'
        default: 'false'

permissions:
  contents: write

concurrency:
  group: intraday-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          # dispatch pe jis branch se chalaya wahi test karo; warna main
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Skip if started too late
        id: window
        run: |
          H=$(TZ=Asia/Kolkata date +%H%M)
          if [ -z "${{ inputs.replay_date }}" ] && [ "${{ inputs.force }}" != 'true' ] \
               && [ "$H" -gt "0940" ]; then
            echo "Started at $H IST, 9:25 window missed - skipping (clean exit)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run paper engine
        if: steps.window.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          RISK_RUPEES: '2500'
          MAX_TRADES: '3'
          CAPITAL: ${{ vars.INTRADAY_CAPITAL || '100000' }}
          REPLAY_DATE: ${{ inputs.replay_date }}
          REPLAY_SYMBOLS: ${{ inputs.replay_symbols }}
          REPLAY_SIDE: ${{ inputs.replay_side }}
        run: python3 scripts/intraday_breadth_paper.py
      - name: Save paper log
        if: always() && steps.window.outputs.skip != 'true'
        run: |
          git config user.name "nse-bot"
          git config user.email "nse-bot@users.noreply.github.com"
          git add data || true
          git commit -m "Paper trades $(TZ=Asia/Kolkata date +%F)" || echo "nothing to commit"
          git pull --rebase -X theirs || true
          git push || true
